services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-schedule-postgres
    environment:
      POSTGRES_DB: platform_schedule
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_schedule"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - platform-schedule-postgres:/var/lib/postgresql/data

volumes:
  platform-schedule-postgres:
