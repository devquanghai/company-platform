platform:
  service-exchange:
    enabled: true
    clients:
      inventory:
        type: webclient
        base-url: ${INVENTORY_BASE_URL}
        resilience-instance: inventory
        ssl-bundle: outbound
      payment:
        type: restclient
        base-url: ${PAYMENT_BASE_URL}
        resilience-instance: payment
        ssl-bundle: outbound

spring:
  http:
    clients:
      redirects: dont-follow
  ssl:
    bundle:
      jks:
        outbound:
          truststore:
            location: ${OUTBOUND_TRUSTSTORE}
            password: ${OUTBOUND_TRUSTSTORE_PASSWORD}

resilience4j:
  circuitbreaker:
    configs:
      outbound-default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-failure-predicate: com.company.platform.exchange.api.resilience.OutboundCircuitBreakerPredicate
    instances:
      inventory:
        base-config: outbound-default
      payment:
        base-config: outbound-default
  retry:
    configs:
      outbound-idempotent:
        max-attempts: 3
        wait-duration: 200ms
        retry-exception-predicate: com.company.platform.exchange.api.resilience.OutboundRetryPredicate
    instances:
      inventory:
        base-config: outbound-idempotent
      payment:
        base-config: outbound-idempotent
  bulkhead:
    configs:
      outbound-default:
        max-concurrent-calls: 50
        max-wait-duration: 0
    instances:
      inventory:
        base-config: outbound-default
      payment:
        base-config: outbound-default
  ratelimiter:
    configs:
      outbound-default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0
    instances:
      inventory:
        base-config: outbound-default
      payment:
        base-config: outbound-default
  timelimiter:
    instances:
      inventory:
        timeout-duration: 3s

management:
  tracing:
    sampling:
      probability: 0.1

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
