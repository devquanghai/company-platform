spring:
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
      redirects: dont-follow
    serviceclient:
      inventory:
        base-url: ${INVENTORY_BASE_URL}
        connect-timeout: 1s
        read-timeout: 2s
        ssl:
          bundle: outbound
  ssl:
    bundle:
      jks:
        outbound:
          truststore:
            location: ${OUTBOUND_TRUSTSTORE}
            password: ${OUTBOUND_TRUSTSTORE_PASSWORD}
  grpc:
    client:
      channels:
        inventory:
          address: ${INVENTORY_GRPC_ADDRESS}
          ssl:
            bundle: outbound

resilience4j:
  circuitbreaker:
    configs:
      outbound-default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
    instances:
      inventory:
        base-config: outbound-default
  retry:
    configs:
      outbound-idempotent:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      inventory:
        base-config: outbound-idempotent
  bulkhead:
    configs:
      outbound-default:
        max-concurrent-calls: 50
        max-wait-duration: 0
    instances:
      inventory:
        base-config: outbound-default
  timelimiter:
    configs:
      outbound-default:
        timeout-duration: 3s
    instances:
      inventory:
        base-config: outbound-default
