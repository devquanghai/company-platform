spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,recordStats
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

platform:
  cache:
    stores:
      local:
        provider: CAFFEINE
      redis-primary:
        provider: REDIS
        redis:
          serialization:
            schema-id: application-cache
            schema-version: 1
    caches:
      customer-profile:
        store: redis-primary
        ttl: 10m
        multi-level:
          enabled: true
          l1-store: local
          l2-store: redis-primary
          l1-ttl: 30s
        ttl-jitter:
          enabled: true
          percentage: 10
