platform:
  cache:
    enabled: true
    annotations-enabled: true
    application: ${spring.application.name:application}
    environment: ${APP_ENVIRONMENT:local}
    defaults:
      ttl: 10m
      key-prefix: ${spring.application.name:application}:cache
      cache-null-values: false
      key-hash-enabled: false
      maximum-entry-size: 1048576

    stores:
      caffeine-primary:
        provider: CAFFEINE
        caffeine:
          maximum-size: 10000
          expire-after-write: 10m
          expire-after-access: 10m
          refresh-after-write: 5m

      redis-primary:
        provider: REDIS
        redis:
          mode: STANDALONE
          database: 0
          client-name: ${spring.application.name:application}-cache
          password: ${REDIS_PRIMARY_PASSWORD:aloaluale}
          standalone:
            host: ${REDIS_PRIMARY_HOST:localhost}
            port: ${REDIS_PRIMARY_PORT:6379}
          serialization:
            key: STRING
            value: JSON
            value-envelope-enabled: true
            schema-id: ${spring.application.name:application}-cache
            schema-version: 1
          resilience:
            enabled: true
            retry:
              enabled: true
              max-attempts: 2
              wait-duration: 50ms
          ssl:
            enabled: false
    caches:
      customers:
        key:
          prefix: ${spring.application.name:application}:cache:customers
        store: redis-primary
        ttl: 15m

      test-cache:
        key:
          prefix: haipq1_test-cache
        store: redis-primary
        ttl: 1m
        failure-policy: FAIL_OPEN

      test-cache-caffeine:
        key:
          prefix: haipq1_test-cache-caffeine
        store: caffeine-primary
        ttl: 1m

      test-cache-optimistic:
        key:
          prefix: haipq1_test-cache-optimistic
        store: redis-primary
        ttl: 1m
        coordination: true
        failure-policy: FAIL_CLOSED
