# New
platform:
  cache:
    enabled: true
    provider: redis
spring:
  cache:
    redis:
      time-to-live: 3600
      use-key-prefix: true
      key-prefix: "${spring.application.name}:"
      customize:
        cache-test:
          ttl: 60

  data:
    redis:

      database: 0
      password: ENC(RxjZleme7oH/6dMMyOhRBUpd37Mud5oeUOnvwebzbl4ws2kjPlTQlmS0++hAFboN)
      sentinel:
        master: mymaster
        nodes:
            - ${REDIS_SENTINEL_HOST:localhost}:${REDIS_SENTINEL_PORT:26379}
        password: ENC(RxjZleme7oH/6dMMyOhRBUpd37Mud5oeUOnvwebzbl4ws2kjPlTQlmS0++hAFboN)

      connect-timeout: 3s
      timeout: 3s

      lettuce:
        cluster:
          refresh:
            dynamic-refresh-sources: true
            period: 30s

        pool:
          enabled: true

resilience4j:
  circuitbreaker:
    instances:
      platformCacheRedis:
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

  retry:
    instances:
      platformCacheRedis:
        max-attempts: 2
        wait-duration: 200ms

  bulkhead:
    instances:
      platformCacheRedis:
        max-concurrent-calls: 50
        max-wait-duration: 0
