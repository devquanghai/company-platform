spring:
  application:
    name: platform-integration-test

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics

platform:
  core:
    openapi:
      enabled: true
      title: Platform Integration Test
      description: Platform Integration Test API
      version: 1.0.0
      servers:
        - url: ${INTEGRATION_ECHO_BASE_URL:https://localhost:8080}
          description: Echo Service
      bearer-format: JWT
    web:
      request-logging-enabled: true
      include-payload: true
  service-exchange:
    enabled: true
    source-application: platform-integration-test
    clients:
      echo:
        protocol: HTTP
        http:
          base-url: ${INTEGRATION_ECHO_BASE_URL:http://localhost:8080}
        resilience:
          enabled: true
        audit:
          enabled: true
        logging:
          enabled: true
          curl-enabled: true
          sensitive-fields:
            - email
            - password
            - token
          sensitive-headers:
            - Authorization
  logging:
    enabled: true
    environment: local
    masking:
      rules:
        - name: integration-email
          match-type: FIELD_NAME
          fields:
            - email
          pii-type: EMAIL
          masking-type: PARTIAL
          visible-prefix: 2
          preserve-domain: true
        - name: integration-password
          match-type: FIELD_NAME
          fields:
            - password
          pii-type: PASSWORD
          masking-type: FULL

        - name: integration-date-of-birth
          match-type: FIELD_NAME
          fields:
            - dateOfBirth
          pii-type: DATE_OF_BIRTH
          masking-type: PARTIAL
          visible-prefix: 4
    crypto:
      enabled: true
      annotation-enabled: false
      fail-if-disabled-annotation-used: true
