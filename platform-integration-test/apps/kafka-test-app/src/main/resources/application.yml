server:
  address: ${TEST_APP_BIND_ADDRESS:127.0.0.1}
  port: ${KAFKA_TEST_APP_PORT:18082}

spring:
  application:
    name: platform-kafka-test-app

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

platform:
  queue:
    enabled: true
    source-application: ${spring.application.name}
    environment: ${APP_ENVIRONMENT:local}
    allow-noop: false
    defaults:
      serialization: JSON
      content-type: application/json
      require-message-id: true
      require-correlation-id: true
      include-trace-context: true
      topology-declaration-mode: DECLARE_AND_VALIDATE
      max-headers: 64
      max-header-bytes: 8192
      max-total-header-bytes: 32768
      max-payload-bytes: 1048576
      max-envelope-bytes: 2097152
    brokers:
      kafka-main:
        enabled: true
        provider: KAFKA
        kafka:
          bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
          client-id-prefix: platform-kafka-test-app
          request-timeout: 10s
          delivery-timeout: 30s
          max-block: 10s
          security-protocol: PLAINTEXT
          transactions-enabled: false
          ssl:
            enabled: false
    destinations:
      kafka-test-events:
        enabled: true
        producer-enabled: true
        consumer-enabled: true
        broker: kafka-main
        publish-mode: DIRECT
        send-timeout: 10s
        kafka:
          topic: ${KAFKA_TEST_TOPIC:platform.test.events.v1}
          partitions: ${KAFKA_TEST_TOPIC_PARTITIONS:3}
          replication-factor: ${KAFKA_TEST_TOPIC_REPLICATION_FACTOR:3}
          require-key: true
        serialization:
          format: JSON
          event-type: KafkaTestEvent
          schema-version: 1
    subscriptions:
      kafka-test-events-subscription:
        enabled: true
        destination: kafka-test-events
        idempotency-enabled: false
        kafka:
          group-id: ${KAFKA_TEST_CONSUMER_GROUP:platform-kafka-test-app}
          concurrency: ${KAFKA_TEST_CONCURRENCY:1}
          mode: REALTIME
          read-committed: false
          strict-ordering: true
          auto-offset-reset: earliest
        retry:
          enabled: false
          max-attempts: 1
          kafka-mode: NONE
        dead-letter:
          enabled: false
    reliability:
      outbox-enabled: false
      inbox-enabled: false
    observability:
      metrics-enabled: true
      tracing-enabled: true
      health-enabled: true
      audit-events-enabled: true
      log-headers: false
      log-payload: false
