server:
  port: 18086

platform:
  core:
    openapi:
      enabled: true
      title: Platform Integration Test
      version: 1.0.0
      description: Platform Integration Test API
      authentication-type: JWT
spring:
  application:
    name: platform-tool-demo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  mustache:
    prefix: classpath:/templates/
    suffix: .mustache
    charset: UTF-8
    check-template-location: true
    servlet:
      expose-request-attributes: false
      expose-session-attributes: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
