platform:
  logging:
    enabled: true
    environment: ${SPRING_PROFILES_ACTIVE:local}
    console:
      enabled: true
      format: TEXT
    structured:
      enabled: false
      format: ECS
    method-logging:
      enabled: true
      include-arguments-by-default: false
      include-result-by-default: false
    masking:
      enabled: true
      fail-on-invalid-rule: true
      rules:
        - name: customer-email
          match-type: FIELD_NAME
          fields: [email, emailAddress]
          pii-type: EMAIL
          masking-type: PARTIAL
          visible-prefix: 2
          preserve-domain: true
    crypto:
      enabled: true
      defaults:
        provider: JCA
        algorithm: AES_GCM_256
        key-alias: application-data
      providers:
        jasypt:
          enabled: false
    audit:
      enabled: true
      fail-mode: FAIL_OPEN

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 210000
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

logging:
  level:
    PLATFORM_CACHE: INFO
    PLATFORM_QUEUE: INFO
    PLATFORM_CRYPTO: INFO
    OUTBOUND_CALL: INFO
